name: Build WordPress plugin ZIPs

on:
  push:
    branches:
      - main
      - integration/parish-forms-v0.1
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: xml, mbstring, zlib, iconv, zip
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Lint plugin PHP
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run bulletin parser regression suite
        run: |
          php tests/regression/run.php
          php tests/regression/run-candidates.php

      - name: Upload candidate regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-regression-diagnostics
          path: tests/regression-output/*.actual.json
          if-no-files-found: ignore

      - name: Run Parish Forms tests
        run: make test-parish-forms

      - name: Run Church Site Controls tests
        run: |
          make test-church-site-controls
          node --check church-site-controls/assets/mega-navigation.js

      - name: Run Church Plugin Deployer tests
        run: make test-church-plugin-deployer

      - name: Build all plugin ZIPs
        id: build
        run: |
          make plugins
          VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' bulletin-upload-wordpress-plugin.php | head -n 1)
          ZIP_NAME="church-bulletin-publisher-${VERSION}.zip"
          cp "../${ZIP_NAME}" "./${ZIP_NAME}"
          PARISH_VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' parish-forms/parish-forms.php | head -n 1)
          PARISH_ZIP_NAME="parish-forms-${PARISH_VERSION}.zip"
          cp "../${PARISH_ZIP_NAME}" "./${PARISH_ZIP_NAME}"
          cp ../church-site-controls-*.zip .
          cp ../church-plugin-deployer-*.zip .
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "parish_zip_name=${PARISH_ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Bulletin Publisher ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_name }}
          if-no-files-found: error

      - name: Upload Parish Forms ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.parish_zip_name }}
          path: ${{ steps.build.outputs.parish_zip_name }}
          if-no-files-found: error

      - name: Upload Church Plugin Deployer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: church-plugin-deployer
          path: church-plugin-deployer-*.zip
          if-no-files-found: error

      - name: Upload Church Site Controls ZIP
        uses: actions/upload-artifact@v4
        with:
          name: church-site-controls
          path: church-site-controls-*.zip
          if-no-files-found: error
